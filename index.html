<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>13 Assyrian Monks in Georgia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Prata & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Prata', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --surface-canvas: #e0d5c1;
      --surface-panel: #ffffff;
      --surface-base: #ffffff;
      --surface-soft: #f5f2eb;
      --surface-hover: #ebe6da;
      --surface-inverse: #1a1a1a;
      --surface-input: #e9e7e2;
      --text-primary: #1a1a1a;
      --text-secondary: #727272;
      --text-inverse: #ffffff;
      --border-selected: #4d4d4d;
      --action-primary-hover: #333333;
      --paper: var(--surface-soft);
      --ink: var(--text-primary);
      --muted: var(--text-secondary);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-s: 12px;
      --radius-m: 20px;
      --radius-card: 16px;
      --radius-pill: 999px;
      --control-height-s: 32px;
      --control-height-m: 40px;
      --control-height-l: 48px;
      --motion-standard: cubic-bezier(.22, 1, .36, 1);
      --ease-ui: cubic-bezier(.4, 0, .2, 1);
      --shadow-button: 0 4px 8px rgba(17,17,17,.16);
      --font-serif: 'Prata', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html[lang="ka"] {
      --font-serif: 'Noto Serif Georgian', 'Prata', Georgia, serif;
      --font-sans: 'Noto Sans Georgian', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow-x: clip;
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      background-color: var(--surface-canvas);
    }
    body {
      margin: 0; padding: 0; width: 100%; height: 100lvh;
      position: relative; overflow-x: clip;
      background-color: var(--surface-canvas); overscroll-behavior: none;
    }
    .hidden, [hidden] { display: none !important; }
    button {
      box-sizing: border-box; display: inline-flex; align-items: center;
      justify-content: center; white-space: nowrap; line-height: 1;
    }
    button, a, [role="button"], input, .monk-card {
      transition:
        background-color .3s var(--ease-ui), color .3s var(--ease-ui), border-color .3s var(--ease-ui),
        box-shadow .3s var(--ease-ui), opacity .3s var(--ease-ui), transform .3s var(--ease-ui);
    }
    /* MapLibre positions markers via transform; animating it makes pins lag behind the map. */
    .map-pin-wrap { transition: none; }
    button:focus-visible, a:focus-visible, [role="button"]:focus-visible, input:focus-visible {
      outline: 2px solid #6f5636; outline-offset: 3px;
    }
    .monk-popup-gmaps:focus-visible, .modal-gmaps:focus-visible { outline: none; }
    /* Single source: edit/re-export images/ui-icons/<name>.svg and every icon updates. */
    .icon {
      display: inline-block; flex-shrink: 0; width: 24px; height: 24px; background-color: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
    }
    .icon-menu { --icon: url('./images/ui-icons/menu.svg'); }
    .icon-close { --icon: url('./images/ui-icons/close.svg'); }
    .icon-search { --icon: url('./images/ui-icons/search.svg'); }
    .icon-arrow-left { --icon: url('./images/ui-icons/arrow-left.svg'); }
    .icon-arrow-right { --icon: url('./images/ui-icons/arrow-right.svg'); }
    .icon-cross { --icon: url('./images/ui-icons/cross.svg'); }
    .icon-map-pin { --icon: url('./images/ui-icons/map-pin.svg'); }
    .icon-chevron-right { width: 16px; height: 16px; --icon: url('./images/ui-icons/chevron-right.svg'); }
    .icon-close-small { width: 16px; height: 16px; --icon: url('./images/ui-icons/close-small.svg'); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: transparent; border-radius: 9999px; }
    #monks-list:hover::-webkit-scrollbar-thumb,
    .modal-content:hover::-webkit-scrollbar-thumb { background: #c9c6bd; }

    #map {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      height: 100lvh !important;
      z-index: 0;
      background-color: var(--surface-canvas);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #e0d5c1 0%,
        rgba(224, 213, 193, 0) 36px,
        rgba(224, 213, 193, 0) calc(100% - 36px),
        #e0d5c1 100%
      );
    }
    .app-header {
      position: fixed; z-index: 15; inset: 0 0 auto; min-height: 72px;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 12px 16px; pointer-events: none;
    }
    .app-header::before {
      position: absolute; z-index: -1; inset: 0 0 -16px; content: ""; pointer-events: none;
      background: linear-gradient(to bottom, rgba(224,213,193,.94) 0%, rgba(224,213,193,.56) 60%, rgba(224,213,193,0) 100%);
      transition: opacity .3s var(--ease-ui);
    }
    .app-title {
      margin: 0; color: var(--ink); font: 400 clamp(26px, 3.4vw, 43px)/1.1 var(--font-serif);
      letter-spacing: -1.2px; text-shadow: 0 1px 8px rgba(255,255,255,.38);
      max-width: 620px;
    }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); pointer-events: auto; }
    .reset-btn {
      display: inline-flex; height: var(--control-height-m); min-width: 0;
      padding: var(--space-2) var(--space-6); border: 0; border-radius: var(--radius-pill);
      background: var(--surface-inverse); color: var(--text-inverse); font: 600 14px var(--font-sans); cursor: pointer;
      box-shadow: var(--shadow-button);
    }
    .reset-btn:hover { background: var(--action-primary-hover); }
    .language-switch {
      position: relative; z-index: 38;
      display: flex; width: var(--control-height-m); height: var(--control-height-m);
      align-items: center; justify-content: center; pointer-events: auto;
    }
    .language-toggle {
      display: flex; width: var(--control-height-m); height: var(--control-height-m);
      align-items: center; justify-content: center; padding: var(--space-2);
      border: 0; border-radius: var(--radius-pill); background: var(--surface-base);
      color: var(--text-primary); cursor: pointer; box-shadow: var(--shadow-button);
    }
    .language-toggle:hover { background: var(--surface-soft); }
    .language-switch.is-open .language-toggle,
    .language-toggle[aria-expanded="true"] {
      background: var(--surface-inverse); color: var(--text-inverse);
    }
    .language-toggle span,
    .language-option span {
      display: grid; width: 24px; height: 24px; place-items: center;
      font: 400 20px/16px var(--font-serif);
    }
    .language-menu {
      position: absolute; top: calc(100% + var(--space-1)); left: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: var(--space-1); border-radius: var(--space-6);
      background: var(--surface-base); box-shadow: var(--shadow-button);
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
      transform-origin: top center;
      transition:
        opacity .22s var(--motion-standard),
        transform .22s var(--motion-standard),
        visibility 0s linear 0s;
    }
    .language-menu[hidden] {
      display: flex !important;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateX(-50%) translateY(-6px) scale(.94);
      transition:
        opacity .18s var(--ease-ui),
        transform .18s var(--ease-ui),
        visibility 0s linear .18s;
    }
    .language-option {
      display: flex; width: var(--control-height-m); height: var(--control-height-m);
      align-items: center; justify-content: center; padding: var(--space-2);
      border: 1.5px solid transparent; border-radius: var(--radius-pill);
      background: transparent; color: var(--text-primary); cursor: pointer;
    }
    .language-option:hover { background: var(--surface-soft); }
    .language-option.is-active,
    .language-option[aria-selected="true"] {
      border-color: var(--border-selected); background: #f0f0f0;
    }
    .mobile-list-toggle, .mobile-list-close, .mobile-reset-btn { display: none; }

    .monks-panel {
      position: fixed; z-index: 10; top: 82px; bottom: 16px; left: 16px;
      display: flex; flex-direction: column; gap: var(--space-4);
      width: min(434px, calc(100vw - 32px)); padding: var(--space-4);
      border: 1px solid rgba(255,255,255,.8); border-radius: 16px;
      background: #f7f5ef; box-shadow: 0 10px 28px rgba(36,31,24,.08);
    }
    .panel-intro {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 0;
      width: 100%; margin: 0; padding: var(--space-1) var(--space-2);
      border: 0; border-radius: 0; background: transparent; color: var(--text-primary); cursor: pointer;
      font: 600 16px/20px var(--font-serif); letter-spacing: 0; text-align: center;
      text-wrap: balance; white-space: normal;
    }
    .panel-intro .icon {
      overflow: hidden;
      transition:
        width .26s var(--motion-standard),
        margin .26s var(--motion-standard),
        opacity .22s var(--ease-ui),
        transform .26s var(--motion-standard);
    }
    .panel-intro .icon-close-small {
      width: 0; margin-right: 0; opacity: 0; transform: scale(.7);
    }
    .panel-intro .icon-chevron-right {
      width: 16px; margin-left: 6px; opacity: 1; transform: translateX(0) scale(1);
    }
    .panel-intro.is-active .icon-chevron-right,
    .panel-intro[aria-current="true"] .icon-chevron-right {
      width: 0; margin-left: 0; opacity: 0; transform: translateX(4px) scale(.7);
    }
    .panel-intro.is-active .icon-close-small,
    .panel-intro[aria-current="true"] .icon-close-small {
      width: 16px; margin-right: 6px; opacity: 1; transform: scale(1);
    }
    .panel-intro:hover, .panel-intro.is-active { color: var(--text-secondary); }
    .panel-intro:focus-visible { outline-offset: 4px; }
    .search-wrap {
      position: relative; flex: 0 0 var(--control-height-m);
      display: block; height: var(--control-height-m);
    }
    .search-icon {
      position: absolute; top: 8px; left: 10px;
      color: var(--text-primary); pointer-events: none;
    }
    #search-input {
      width: 100%; height: 100%; padding: 0 44px 0 44px; outline: none; -webkit-appearance: none; appearance: none;
      border: 1.5px solid var(--text-secondary); border-radius: var(--radius-pill); background: transparent;
      color: var(--text-primary); font: 14px/20px var(--font-sans);
    }
    #search-input:focus, #search-input:focus-visible { outline: none; border-color: var(--text-primary); }
    #search-input::placeholder { color: var(--text-secondary); }
    #search-input::-webkit-search-cancel-button, #search-input::-webkit-search-decoration {
      display: none; -webkit-appearance: none; appearance: none;
    }
    .search-clear {
      position: absolute; top: 4px; right: 4px; display: inline-flex; width: var(--control-height-s); height: var(--control-height-s);
      align-items: center; justify-content: center; padding: var(--space-1); border: 0;
      border-radius: var(--radius-pill); background: transparent; color: var(--text-primary); cursor: pointer;
    }
    .search-clear:hover { background: var(--surface-hover); }
    .search-clear:focus-visible { outline: none; background: var(--surface-hover); }
    .search-wrap:has(#search-input:placeholder-shown) .search-clear { display: none; }
    #monks-list { display: flex; flex: 1; flex-direction: column; gap: var(--space-3); min-height: 0; overflow-y: auto; padding: 0 4px 2px 0; margin-right: calc(6px - var(--space-4)); }
    .empty-state {
      display: flex; align-items: center; justify-content: center; min-height: 180px; padding: 20px 16px;
    }
    .empty-state-card {
      width: 100%; padding: 20px 18px; border: 0; background: transparent; text-align: center;
    }
    .empty-state-card h3 { margin: 0 0 8px; color: #171717; font: 400 24px/1.2 var(--font-serif); }
    .empty-state-card p { margin: 0 0 14px; color: #666; font: 13px/1.5 var(--font-sans); }
    .empty-state-action {
      display: inline-flex; height: var(--control-height-m); padding: 0 16px;
      border: 0; border-radius: var(--radius-pill); background: #171717;
      color: white; font: 600 12px var(--font-sans); cursor: pointer;
    }
    .monk-skeleton {
      position: relative; display: grid; flex: 0 0 64px; height: 64px; overflow: hidden;
      grid-template-columns: 24px 48px minmax(0, 1fr); align-items: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-4); border-radius: 8px;
    }
    .monk-skeleton > i { display: block; height: 20px; border-radius: var(--radius-pill); background: var(--surface-hover); }
    .monk-skeleton > .sk-avatar { width: 48px; height: 48px; }
    .monk-skeleton > .sk-lines { display: grid; height: auto; gap: 6px; justify-items: center; background: none; }
    .monk-skeleton > .sk-lines b { display: block; width: 80%; height: 14px; border-radius: var(--radius-pill); background: var(--surface-hover); }
    .monk-skeleton > .sk-lines b + b { width: 60%; }
    .monk-skeleton::after, .mobile-skel-card::after {
      position: absolute; inset: 0; content: "";
      background: linear-gradient(90deg, transparent, var(--surface-soft), transparent);
      transform: translateX(-100%); animation: skeleton-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-shimmer { to { transform: translateX(100%); } }
    @keyframes list-reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    #monks-list.is-revealing > * { animation: list-reveal .3s ease-out both; }
    .mobile-card-skeleton { display: none; }
    .app-status {
      position: fixed; z-index: 40; bottom: 24px; left: 50%;
      display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px);
      padding: var(--space-3) var(--space-4); transform: translateX(-50%);
      border: 1px solid rgba(17,17,17,.08); border-radius: 12px;
      background: var(--surface-panel); color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(17,17,17,.12);
      font: 13px/1.4 var(--font-sans);
    }
    .app-status::before {
      width: 18px; height: 18px; flex: 0 0 18px; content: "";
      border: 2px solid #ded9cf; border-top-color: #6f5636; border-radius: 50%;
      animation: status-spin .8s linear infinite;
    }
    @keyframes status-spin { to { transform: rotate(360deg); } }
    .app-status.is-error {
      top: 50%; bottom: auto; flex-wrap: wrap; width: min(380px, calc(100vw - 32px));
      padding: var(--space-6); transform: translate(-50%, -50%);
    }
    .app-status.is-error::before { display: none; }
    .app-status-retry {
      display: inline-flex; height: var(--control-height-m); margin-left: auto;
      padding: 0 16px; border: 0; border-radius: var(--radius-pill);
      background: #171717; color: #fff; font: 500 12px var(--font-sans); cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important; animation-duration: .01ms !important;
        animation-iteration-count: 1 !important; transition-duration: .01ms !important;
      }
    }
    #counter { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .map-pin-wrap { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .map-pin {
      display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 50%;
      background: var(--surface-base); color: var(--text-primary);
      filter: drop-shadow(0 4px 8px rgba(17,17,17,.22));
      transition: background-color .3s var(--ease-ui), color .3s var(--ease-ui);
    }
    .map-pin .icon { width: 24px; height: 24px; }
    .map-pin.is-active { background: var(--surface-inverse); color: var(--text-inverse); }
    .map-pin-wrap:focus-visible {
      border-radius: 50%; outline: 2px solid #6f5636; outline-offset: 3px;
    }

    .monk-card {
      display: grid; flex: 0 0 64px; grid-template-columns: 24px 48px minmax(0,1fr);
      align-items: center; gap: var(--space-3); width: 100%; height: 64px; padding: var(--space-2) var(--space-4);
      border: 0; border-radius: 8px; background: transparent; color: var(--text-primary); cursor: pointer;
      cursor: pointer;
    }
    .monk-card:hover { background: var(--surface-hover); }
    #monks-list:has(.monk-card[aria-current="true"]) .monk-card:hover { background: var(--surface-hover); }
    #monks-list .monk-card[aria-current="true"] {
      background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-selected);
    }
    #monks-list .monk-card[aria-current="true"]:hover { background: transparent; }
    .card-number { padding-top: 4px; color: var(--text-primary); font: 400 20px/24px var(--font-serif); text-align: center; }
    .card-icon-frame {
      position: relative; display: grid; width: 48px; height: 48px; overflow: hidden; place-items: center;
      border-radius: 50%; background: #e8e6e0; color: #8a8882;
    }
    .card-icon-frame::after {
      position: absolute; content: ''; width: 24px; height: 24px; background-color: currentColor;
      -webkit-mask: url('./images/ui-icons/cross.svg') center / contain no-repeat;
      mask: url('./images/ui-icons/cross.svg') center / contain no-repeat;
    }
    .card-icon-frame img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .card-copy { min-width: 0; text-align: center; }
    .card-copy h3 {
      overflow: hidden; margin: -2px 0; padding: 2px 0; color: var(--text-primary); font: 600 16px/22px var(--font-serif);
      text-overflow: ellipsis; white-space: nowrap;
    }
    .card-copy p { overflow: hidden; margin: 0; color: var(--text-secondary); font: 14px/20px var(--font-sans); text-overflow: ellipsis; white-space: nowrap; }

    .detail-overlay {
      position: fixed; top: 84px; bottom: 16px;
      left: calc(32px + min(434px, calc(100vw - 32px)));
      width: min(434px, calc(100vw - min(434px, calc(100vw - 32px)) - 48px));
      pointer-events: none;
      opacity: 1; visibility: visible;
      transition: opacity .26s var(--motion-standard), visibility 0s linear 0s;
    }
    .detail-overlay.hidden {
      display: block !important;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .22s var(--ease-ui), visibility 0s linear .22s;
    }
    .monk-detail-modal {
      position: absolute; z-index: 30; inset: 0;
      display: flex; width: 100%; max-height: none; pointer-events: auto;
      flex-direction: column; overflow: hidden;
      border: 0; border-radius: var(--radius-s); background: var(--surface-base);
      opacity: 1; visibility: visible; transform: translateY(0) scale(1);
      transition: opacity .28s var(--motion-standard), transform .28s var(--motion-standard), visibility 0s linear 0s;
    }
    .monk-detail-modal.hidden {
      display: flex !important;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(10px) scale(.985);
      transition: opacity .22s var(--ease-ui), transform .22s var(--ease-ui), visibility 0s linear .22s;
    }
    .modal-content { flex: 1; overflow-y: auto; margin-right: 6px; padding: var(--space-6) 10px 96px var(--space-4); text-align: center; }
    @keyframes detail-card-enter-next {
      from { transform: translateX(100vw); }
      to { transform: translateX(0); }
    }
    @keyframes detail-card-enter-previous {
      from { transform: translateX(-100vw); }
      to { transform: translateX(0); }
    }
    @keyframes detail-card-exit-next {
      from { transform: translateX(0); }
      to { transform: translateX(-100vw); }
    }
    @keyframes detail-card-exit-previous {
      from { transform: translateX(0); }
      to { transform: translateX(100vw); }
    }
    .modal-close {
      position: absolute; top: 13px; right: 14px; z-index: 2; display: inline-flex;
      width: 34px; height: 34px; place-items: center; padding: 0; border: 0;
      background: transparent; color: #111; cursor: pointer; pointer-events: auto;
    }
    .modal-close:hover { color: #777; }
    #modal-monk-index { display: block; margin-bottom: var(--space-6); color: var(--text-primary); font: 600 16px/20px var(--font-serif); }
    #modal-monk-name { margin: 0 0 var(--space-6); color: var(--text-primary); font: 400 24px/28px var(--font-serif); }
    .modal-icon-frame {
      position: relative; display: grid; width: 160px; height: 160px; margin: 0 auto var(--space-6);
      overflow: hidden; place-items: center; border: 0;
      border-radius: 50%; background: #eeece8;
    }
    .modal-icon { display: block; width: 100%; height: 100%; object-fit: cover; }
    .modal-icon-fallback { display: none; width: 42px; height: 42px; color: #777; }
    .modal-icon-frame.is-missing .modal-icon { display: none; }

        align-items: center; justify-content: center; padding: var(--space-2); border: 0;
        border-radius: var(--radius-pill); background: var(--surface-base); color: var(--text-primary); pointer-events: auto;
        box-shadow: var(--shadow-button);
        transform: translateZ(0); will-change: transform;
      }
      body.monk-modal-open .app-header {
        z-index: 40; min-height: 0; padding-bottom: 0;
        grid-template-areas: "menu title lang";
      }
      body.monk-modal-open .app-header::before,
      body.monk-modal-open .app-header::after,
      body.monk-modal-open .app-header .app-title,
      body.monk-modal-open .app-header .mobile-list-toggle,
      body.monk-modal-open .app-header .reset-btn {
        display: none;
      }
      .modal-footer {
        position: absolute; right: var(--space-4); bottom: calc(var(--space-4) + env(safe-area-inset-bottom)); left: var(--space-4); z-index: 2;
        display: flex; gap: var(--space-3); justify-content: center; pointer-events: none;
        padding: var(--space-3) 0; border-radius: 0 0 var(--radius-s) var(--radius-s);
        background: linear-gradient(to top, var(--surface-base) 40%, rgba(255,255,255,0));
      }
      .modal-gmaps {
        display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: var(--space-3);
        height: var(--control-height-m); padding: var(--space-2) var(--space-3) var(--space-2) var(--space-5);
        border: 0; border-radius: var(--radius-pill); pointer-events: auto;
        font: 600 14px var(--font-sans); text-decoration: none;
      }
      .modal-gmaps { background: var(--surface-inverse); color: var(--text-inverse); }
      .monk-detail-modal .modal-close { display: inline-flex; }
      .mobile-card-skeleton {
        display: flex; width: 100%; padding: 0 var(--space-8); pointer-events: none;
      }
      .mobile-skel-card {
        position: relative; display: flex; flex: 0 0 calc(100vw - 64px); height: 240px; flex-direction: column;
        align-items: center; gap: var(--space-3); overflow: hidden; padding-bottom: var(--space-3);
        border-radius: var(--radius-m); background: var(--surface-base);
      }
      .mobile-skel-card > i { display: block; flex: 1; width: 100%; background: var(--surface-hover); }
      .mobile-skel-card > b { display: block; width: 50%; height: 16px; border-radius: var(--radius-pill); background: var(--surface-hover); }
      .mobile-skel-card > b + b { width: 35%; }
      .mobile-skel-card > u { display: block; width: 96px; height: 32px; border-radius: var(--radius-pill); background: var(--surface-soft); }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing monastery locations"></div>
  <div id="app-status" class="app-status" role="status" aria-live="polite">
    <span id="app-status-message" data-i18n="status.loading">Loading monastery locations…</span>
    <button id="app-status-retry" class="app-status-retry" type="button" data-i18n="status.retry" hidden>Retry</button>
  </div>
  <div id="mobile-card-overlay">
    <div class="mobile-card-skeleton" aria-hidden="true">
      <div class="mobile-skel-card"><i></i><b></b><b></b><u></u></div>
    </div>
  </div>

  <header class="app-header">
    <h1 class="app-title" data-i18n="app.title">13 Assyrian fathers in Georgia</h1>
    <div class="header-actions">
      <button id="reset-btn" class="reset-btn" type="button" aria-pressed="false" data-i18n="header.viewMap">View map</button>
      <div id="language-switch" class="language-switch">
        <button
          id="language-toggle"
          class="language-toggle"
          type="button"
          aria-label="Change language"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span id="language-current-flag" aria-hidden="true">🇬🇧</span>
        </button>
        <div
          id="language-menu"
          class="language-menu"
          role="listbox"
          aria-label="Select language"
          hidden
        >
          <button class="language-option is-active" type="button" role="option" data-lang="en" aria-selected="true" aria-label="English">
            <span aria-hidden="true">🇬🇧</span>
          </button>
          <button class="language-option" type="button" role="option" data-lang="ka" aria-selected="false" aria-label="ქართული">
            <span aria-hidden="true">🇬🇪</span>
          </button>
          <button class="language-option" type="button" role="option" data-lang="ru" aria-selected="false" aria-label="Русский">
            <span aria-hidden="true">🇷🇺</span>
          </button>
        </div>
      </div>
      <button id="mobile-list-toggle" class="mobile-list-toggle" type="button" aria-label="Open monastery list" data-i18n-aria-label="header.openList" aria-expanded="false">
        <i class="icon icon-menu" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="main-layout">
    <aside class="monks-panel" aria-label="Monastery list">
      <button id="mobile-list-close" class="mobile-list-close" type="button" aria-label="Close monastery list" data-i18n-aria-label="header.closeList">
        <i class="icon icon-close" aria-hidden="true"></i>
      </button>
      <button id="card-intro" class="panel-intro" type="button">
        <i class="icon icon-close-small" aria-hidden="true"></i>
        <span data-i18n="intro.label">Context</span>
        <i class="icon icon-chevron-right" aria-hidden="true"></i>
      </button>
      <button id="mobile-reset-btn" class="mobile-reset-btn" type="button" data-i18n="header.resetMap">Reset map</button>
      <label class="search-wrap">
        <i class="icon icon-search search-icon" aria-hidden="true"></i>
        <input id="search-input" type="search" placeholder="Search" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.ariaLabel" aria-label="Search by monk, monastery, or region">
        <button id="search-clear" class="search-clear" type="button" aria-label="Clear search" data-i18n-aria-label="search.clear">
          <i class="icon icon-close-small" aria-hidden="true"></i>
        </button>
      </label>
      <span id="counter" aria-live="polite">0 monasteries</span>
      <div id="monks-list" aria-busy="true">
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
        <div class="monk-skeleton" aria-hidden="true"><i></i><i class="sk-avatar"></i><i class="sk-lines"><b></b><b></b></i></div>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js?v=figma-sync-26"></script>

  <div id="detail-overlay" class="detail-overlay hidden">
    <button id="close-modal-btn" class="modal-close" type="button" aria-label="Close">
      <i class="icon icon-close" aria-hidden="true"></i>
    </button>
    <div class="modal-side-preview modal-side-preview-previous" aria-hidden="true"></div>
    <div class="modal-side-preview modal-side-preview-next" aria-hidden="true"></div>
    <section id="monk-detail-modal" class="monk-detail-modal hidden" aria-modal="true" role="dialog" aria-labelledby="modal-monk-name">
      <div class="modal-content">
        <div class="modal-card">
        <span id="modal-monk-index">2</span>
        <h2 id="modal-monk-name">Anton of Martqopi</h2>
        <div id="modal-icon-frame" class="modal-icon-frame">
          <img id="modal-monk-icon" class="modal-icon" src="" alt="" width="160" height="160" decoding="async">
          <i class="icon icon-cross modal-icon-fallback" aria-hidden="true"></i>
        </div>
        <div id="modal-monk-desc"></div>
        <div class="desktop-modal-gmaps-wrap">
          <a id="modal-monk-gmaps-desktop" class="modal-gmaps" href="#" target="_blank" rel="noopener noreferrer">
            <span data-i18n="card.openMaps">Open in Google Maps</span>
            <i class="icon icon-map-pin" aria-hidden="true"></i>
          </a>
        </div>
        </div>
      </div>
      <div class="desktop-detail-nav" aria-label="Browse monks">
        <button id="detail-prev" type="button" aria-label="Previous monk"><i class="icon icon-arrow-left" aria-hidden="true"></i></button>
        <button id="detail-next" type="button" aria-label="Next monk"><i class="icon icon-arrow-right" aria-hidden="true"></i></button>
      </div>
      <div class="modal-footer">
        <a id="modal-monk-gmaps" class="modal-gmaps" href="#" target="_blank" rel="noopener noreferrer">
          <span data-i18n="card.openMaps">Open in Google Maps</span>
          <i class="icon icon-map-pin" aria-hidden="true"></i>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
